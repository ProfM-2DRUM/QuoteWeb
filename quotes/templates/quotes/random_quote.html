{% extends 'base.html' %}

{% block content %}
    <div class="random-quote-container">
        <h2>Random Music Quote</h2>
        {% if quote %}
            <div class="quote featured">
                <div class="quote-text">"{{ quote.text }}"</div>
                <div class="quote-author">{{ quote.author }}</div>
            </div>
            <div class="quote-actions">
                <a href="{% url 'quotes:random_quote' %}" class="btn">Another Random Quote</a>
                <a href="{% url 'quotes:quote_list' %}" class="btn btn-secondary">View All Quotes</a>
            </div>
        {% else %}
            <p>No quotes available yet.</p>
        {% endif %}
    </div>
{% endblock %}

{% block extra_css %}
<style>
    .random-quote-container {
        text-align: center;
        max-width: 800px;
        margin: 2rem auto;
        padding: 2rem;
    }
    
    .quote.featured {
        background-color: #f8f9fa;
        border-left: 5px solid #3498db;
        padding: 2rem;
        margin: 2rem 0;
        font-size: 1.4rem;
        line-height: 1.8;
    }
    
    .quote-actions {
        margin-top: 2rem;
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
    }
    
    .btn {
        display: inline-block;
        padding: 0.8rem 1.5rem;
        background-color: #3498db;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        transition: all 0.3s ease;
        border: none;
        cursor: pointer;
        font-size: 1rem;
    }
    
    .btn:hover {
        background-color: #2980b9;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    
    .btn-secondary {
        background-color: #6c757d;
    }
    
    .btn-secondary:hover {
        background-color: #5a6268;
    }
</style>
{% endblock %}
